# Resolve relative paths from the directory containing this YAML file.
version: 3

project:
  id: camp_fire_qaqc
  name: camp_fire_qaqc
  fire_date: '2018-11-08'

paths:
  # A local COG path or an HTTP(S) URL.
  imagery_cog: https://pub-74744b71dff145398dad71e2c6fb505c.r2.dev/waldoair-campfire/waldoair_campfire.tif

# *!*! Each GeoParquet is an independent layer. Bootstrap reprojects to
# *!*! EPSG:4326, filters to the COG bounds, and generates H3.
layers:
  - id: features
    name: Buildings
    source: https://pub-4a2d84525cf448ee8b7202f038c0622c.r2.dev/camp_overture_2024-02-15-alpha-0.parquet
    geometry_types:
      - Polygon
      - MultiPolygon
    crs: EPSG:4326
    fields:
      feature_id: id
      predicted_class: predicted_class
      confidence: confidence
    h3_prefix: h3_r
    h3_resolutions: [5, 6, 7, 8, 9, 10]
    modes:
      - annotation
      - editing
    editing:
      move: true
      reshape: true
      create: true
      delete: true

  - id: dins
    name: CAL FIRE DINS
    source: https://pub-4a2d84525cf448ee8b7202f038c0622c.r2.dev/DINS.parquet
    crs: EPSG:6414
    geometry_types:
      - Point
    fields:
      feature_id: GLOBALID
      predicted_class: DAMAGE
      display:
        - DAMAGE
        - STRUCTURETYPE
        - SITEADDRESS
        - INCIDENTNAME
    h3_prefix: h3_r
    h3_resolutions: [5, 6, 7, 8, 9, 10]
    modes:
      - annotation
      - editing
    editing:
      move: true

annotation:
  labels:
    - damaged
    - undamaged
    - unknown

workflow:
  modes:
    - annotation
    - editing
  reviewers:
    - id: Pazazu
      assignments:
        # *!*! An empty H3 list assigns every COG-filtered feature for that
        # *!*! layer. Add indexes here when dividing work among reviewers.
        - layer: features
          modes:
            - annotation
            - editing
          h3_indexes: []
        - layer: dins
          modes:
            - annotation
            - editing
          h3_indexes: []

    # *!*! Temporary limited account for exercising shared-URL identity and
    # *!*! assignment filtering during development.
    - id: TestReviewer
      assignments:
        - layer: features
          modes:
            - annotation
          h3_indexes:
            - 882814a201fffff
        - layer: dins
          modes:
            - annotation
          h3_indexes:
            - 882814a201fffff
